<script>
var DB="https://firebaseio.com",PASS="reknaaz123",isAdmin=false,tab="ALL",lastSig="",firstLoad=true;
var emps=["Reknaaz","Emp 2","Emp 3","Emp 4","Emp 5","Emp 6","Emp 7","Emp 8","Emp 9","Emp 10","Emp 11","Emp 12","Emp 13"],ser=1001,jobs={};
function enableNotif(){if("Notification"in window)Notification.requestPermission();notify("Sound & Screen Alerts Enabled!")}
function beep(){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.15;o.start();setTimeout(function(){o.stop()},220)}catch(e){}}
function notify(msg){
  beep();var t=document.getElementById("toast");t.textContent="Alert: "+msg;t.style.display="block";
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display="none"},5000);
  if("Notification"in window&&Notification.permission==="granted")new Notification("Northern Printing Alert",{body:msg});
}
function pull(){
  fetch(DB+"/.json").then(function(r){return r.json()}).then(function(d){
    d=d||{};
    if(Array.isArray(d.emps)&&d.emps.length===13)emps=d.emps;
    if(d.ser)ser=d.ser;
    var nj=d.jobs||{};
    var sig=JSON.stringify(nj);
    if(!firstLoad&&sig!==lastSig)notify("Job Card Updated!");
    firstLoad=false;lastSig=sig;jobs=nj;refreshUI();render();
  });
}
function push(path,val){return fetch(DB+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)})}
function refreshUI(){
  document.getElementById("serBadge").textContent="Next: JC-"+ser;
  var s=document.getElementById("empSel"),cur=s.value;s.innerHTML="";
  emps.forEach(function(e,i){var o=document.createElement("option");o.value=e;o.textContent=(i+1)+". "+e;s.appendChild(o)});
  if(cur)s.value=cur;
}
function openAdm(){
  if(prompt("Reknaaz Password:")!==PASS)return alert("Access Denied — Only Reknaaz can access.");
  isAdmin=true;var c=document.getElementById("empList");c.innerHTML="";
  for(var i=0;i<13;i++)c.innerHTML+='<div class="fld"><label>Staff '+(i+1)+'</label><input id="e_'+i+'" value="'+(emps[i]||"")+'"></div>';
  document.getElementById("adminBox").style.display="block";render();
}
function closeAdm(){isAdmin=false;document.getElementById("adminBox").style.display="none";render()}
function saveEmp(){
  for(var i=0;i<13;i++)emps[i]=document.getElementById("e_"+i).value.trim()||("Emp "+(i+1));
  push("/emps",emps).then(function(){refreshUI();alert("13 Employee names saved across all devices!")});
}
function resetSer(){if(confirm("Reset serial to JC-1001?")){ser=1001;push("/ser",1001).then(refreshUI)}}
document.getElementById("jForm").onsubmit=function(e){
  e.preventDefault();var f=document.getElementById("fAtt").files.item(0);
  if(f&&f.size>1500000)return alert("File must be under 1.5 MB.");
  function add(fd,fn,ft){
    var t=document.getElementById("jType").value,inv=document.getElementById("invNo").value.trim(),now=new Date().toLocaleString(),no="JC-"+ser,id="j_"+Date.now();
    var ph=document.getElementById("cPhone").value.replace(/[^0-9]/g,"");if(ph.length===8||ph.length===7)ph="230"+ph;
    jobs[id]={no:no,type:t,by:document.getElementById("bySec").value,emp:document.getElementById("empSel").value,inv:inv,noInv:!inv,ctp:t==="Offset",dig:t==="Digital",prd:false,del:false,done:false,cname:document.getElementById("cName").value,cphone:ph,title:document.getElementById("jTitle").value,ddate:document.getElementById("dDate").value,paper:document.getElementById("paper").value,qty:document.getElementById("qty").value,specs:document.getElementById("specs").value,notes:document.getElementById("notes").value,fd:fd||"",fn:fn||"",ft:ft||"",cAt:now,uAt:now};
    ser++;lastSig=JSON.stringify(jobs);
    Promise.all([push("/jobs/"+id,jobs[id]),push("/ser",ser)]).then(function(){refreshUI();render();e.target.reset();notify(no+" sent to "+(t==="Offset"?"CTP":"Digital Queue")+"!")});
  }
  if(f){var r=new FileReader();r.onload=function(v){add(v.target.result,f.name,f.type)};r.readAsDataURL(f)}else add();
};
function act(id,fn,msg){
  fn(jobs[id]);jobs[id].uAt=new Date().toLocaleString();lastSig=JSON.stringify(jobs);
  push("/jobs/"+id,jobs[id]).then(function(){render();if(msg)notify(jobs[id].no+": "+msg)});
}
function addInv(id){var v=prompt("Enter Invoice #:");if(v)act(id,function(j){j.inv=v.trim();j.noInv=false},"Invoice "+v.trim()+" added")}
function delJob(id){
  if(!isAdmin)return alert("Only Reknaaz can delete.");
  if(confirm("Delete "+jobs[id].no+"?")){var no=jobs[id].no;delete jobs[id];lastSig=JSON.stringify(jobs);fetch(DB+"/jobs/"+id+".json",{method:"DELETE"}).then(function(){render();notify(no+" deleted")})}
}
function setTab(t,b){tab=t;document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});b.classList.add("active");render()}
function cardHTML(id,j){
  var st=j.ctp?"CTP (Plates)":j.dig?"Digital Queue":j.prd?"Production":j.del?"Ready for Delivery":"Delivered";
  var att=j.fd?(j.ft.indexOf("image")>-1?'<div class="att"><a href="'+j.fd+'" download="'+j.fn+'">JPG: '+j.fn+'</a><img src="'+j.fd+'"></div>':'<div class="att"><a href="'+j.fd+'" target="_blank" download="'+j.fn+'">PDF: '+j.fn+'</a></div>'):"";
  var msg=encodeURIComponent("Hello "+j.cname+", your order "+j.no+" ("+j.title+") is ready for delivery.");
  var delBtn=isAdmin?'<button class="ab" style="background:#dc2626;margin-left:auto" onclick="delJob(\''+id+'\')">Delete</button>':"";
  var btns=(j.noInv?'<button class="ab" style="background:#2563eb" onclick="addInv(\''+id+'\')">+ Add Invoice</button>':"")+(j.ctp?'<button class="ab" style="background:#059669" onclick="act(\''+id+'\',function(x){x.ctp=false;x.prd=true},\'Plates Ready -> Production\')">Plates Ready -> Production</button>':"")+(j.dig?'<button class="ab" style="background:#2563eb" onclick="act(\''+id+'\',function(x){x.dig=false;x.prd=true},\'Sent to Production\')">To Production -></button><button class="ab" style="background:#7e22ce" onclick="act(\''+id+'\',function(x){x.dig=false;x.del=true},\'Digital Finish -> Delivery\')">Work Finish -> Delivery</button>':"")+(j.prd?'<button class="ab" style="background:#059669" onclick="act(\''+id+'\',function(x){x.prd=false;x.del=true},\'Production Finish -> Delivery\')">Send to Delivery -></button>':"")+(j.del?'<a class="ab" style="background:#16a34a" href="https://wa.me+'" target="_blank">WhatsApp</a><a class="ab" style="background:#0284c7" href="sms:+'+j.cphone+'?body='+msg+'">SMS</a><a class="ab" style="background:#475569" href="tel:+'+j.cphone+'">Call</a><button class="ab" style="background:#059669" onclick="act(\''+id+'\',function(x){x.del=false;x.done=true},\'Order Delivered!\')">Delivered</button>':"");
  return '<div class="card '+(j.type==="Digital"?"dig":"")+'"><div class="chdr"><span>'+j.no+' — '+j.cname+'</span><span>'+j.type+'</span></div><div><span class="pill">'+st+'</span>'+(j.noInv?'<span class="pill red">Finance: No Invoice</span>':'')+'</div><p><b>Job:</b> '+j.title+'</p><p><b>Delivery Date:</b> '+j.ddate+' | <b>Tel:</b> +'+j.cphone+'</p><p><b>Invoice:</b> '+(j.inv||"Pending")+' | <b>Staff:</b> '+j.emp+' ('+j.by+')</p><p><b>Paper:</b> '+(j.paper||"-")+' | <b>Qty/Size:</b> '+(j.qty||"-")+'</p><p><b>Specs:</b> '+(j.specs||"-")+'</p><p><b>Notes:</b> '+(j.notes||"-")+'</p>'+att+'<div class="ts">Created: '+j.cAt+' | Updated: '+j.uAt+'</div><div class="acts">'+btns+'<button class="ab" style="background:#64748b" onclick="window.print()">Print</button>'+delBtn+'</div></div>';
}
function render(){
  var w=document.getElementById("wrap");w.innerHTML="";
  var list=Object.keys(jobs).reverse().filter(function(id){var j=jobs[id];if(tab==="ALL")return !j.done||j.noInv;if(tab==="FIN")return j.noInv;if(tab==="CTP")return j.ctp;if(tab==="DIG")return j.dig;if(tab==="PRD")return j.prd;if(tab==="DEL")return j.del;if(tab==="DONE")return j.done});
  if(tab==="DEL"){var grp={};list.forEach(function(id){var d=jobs[id].ddate||"No Date";(grp[d]=grp[d]||[]).push(id)});Object.keys(grp).sort().forEach(function(d){w.innerHTML+='<div class="dt-hdr">Delivery Date: '+d+' ('+grp[d].length+' Jobs)</div><div class="cards">'+grp[d].map(function(id){return cardHTML(id,jobs[id])}).join("")+'</div>'});return}
  w.innerHTML='<div class="cards">'+list.map(function(id){return cardHTML(id,jobs[id])}).join("")+'</div>';
}
pull();setInterval(pull,2500);
</script>
</body>
</html>
